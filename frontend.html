<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visitenkarten Scanner - KI Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            width: 100%;
            padding: 40px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }
        
        .demo-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .card-option {
            border: 3px solid #e0e0e0;
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            background: #f9f9f9;
        }
        
        .card-option:hover {
            border-color: #667eea;
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }
        
        .card-option img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 12px;
            background: #e0e0e0;
        }
        
        .card-option h3 {
            color: #333;
            font-size: 1.1em;
        }
        
        .upload-section {
            border: 3px dashed #667eea;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            margin-bottom: 30px;
            background: #f8f9ff;
            transition: all 0.3s ease;
        }
        
        .upload-section:hover {
            background: #f0f2ff;
            border-color: #764ba2;
        }
        
        .upload-section input[type="file"] {
            display: none;
        }
        
        .upload-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            cursor: pointer;
            transition: transform 0.2s ease;
            font-weight: 600;
        }
        
        .upload-btn:hover {
            transform: scale(1.05);
        }
        
        .upload-btn:active {
            transform: scale(0.98);
        }
        
        #result {
            background: #f5f5f5;
            border-radius: 12px;
            padding: 25px;
            margin-top: 30px;
            display: none;
            border-left: 5px solid #667eea;
        }
        
        #result.success {
            border-left-color: #4caf50;
            background: #f1f8f4;
        }
        
        #result.error {
            border-left-color: #f44336;
            background: #fef1f0;
        }
        
        .result-title {
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
        }
        
        .result-data {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-top: 15px;
        }
        
        .result-field {
            display: grid;
            grid-template-columns: 150px 1fr;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .result-field:last-child {
            border-bottom: none;
        }
        
        .result-label {
            font-weight: 600;
            color: #555;
        }
        
        .result-value {
            color: #333;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
            display: none;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .loading #spinner {
            display: block;
        }
        
        .badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
            margin-left: 10px;
        }
        
        .badge.success {
            background: #4caf50;
            color: white;
        }
        
        .badge.warning {
            background: #ff9800;
            color: white;
        }
        
        .badge.update {
            background: #2196F3;
            color: white;
        }
        
        .badge.create {
            background: #4caf50;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎴 Visitenkarten Scanner</h1>
        <p class="subtitle">KI-gestützte OCR & automatische CRM-Integration</p>
        
        <div class="demo-cards">
            <div class="card-option" onclick="scanDemoCard('card1')">
                <img src="https://via.placeholder.com/300x200/667eea/ffffff?text=Demo+Karte+1" alt="Demo Card 1" id="demo-img-1">
                <h3>📇 Demo Karte A</h3>
            </div>
            
            <div class="card-option" onclick="scanDemoCard('card2')">
                <img src="https://via.placeholder.com/300x200/764ba2/ffffff?text=Demo+Karte+2" alt="Demo Card 2" id="demo-img-2">
                <h3>📇 Demo Karte B</h3>
            </div>
        </div>
        
        <div class="upload-section">
            <h3 style="margin-bottom: 15px; color: #333;">Oder eigene Visitenkarte hochladen</h3>
            <input type="file" id="fileUpload" accept="image/*" onchange="handleFileUpload(event)">
            <label for="fileUpload">
                <button class="upload-btn" onclick="document.getElementById('fileUpload').click(); return false;">
                    📸 Datei auswählen
                </button>
            </label>
            <p style="margin-top: 15px; color: #666; font-size: 0.9em;">
                Unterstützt: JPG, PNG, WebP (max 10MB)
            </p>
        </div>
        
        <div id="spinner" class="spinner"></div>
        
        <div id="result"></div>
    </div>

    <script>
        // ⚠️ WICHTIG: Ersetze diese URL mit deiner n8n Webhook URL!
        const WEBHOOK_URL = 'https://DEINE-N8N-URL.com/webhook/business-card';
        
        // Demo-Karten URLs (ersetze mit echten Visitenkarten-Bildern)
        const DEMO_CARDS = {
            card1: 'https://raw.githubusercontent.com/n8n-io/n8n/master/assets/n8n-logo.png',
            card2: 'https://raw.githubusercontent.com/n8n-io/n8n/master/assets/n8n-logo.png'
        };

        async function scanDemoCard(cardId) {
            const imageUrl = DEMO_CARDS[cardId];
            await sendToN8N({ imageUrl });
        }

        async function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            // Validate file size (max 10MB)
            if (file.size > 10 * 1024 * 1024) {
                showError('Datei ist zu groß (max 10MB)');
                return;
            }
            
            // Validate file type
            if (!file.type.startsWith('image/')) {
                showError('Bitte nur Bilddateien hochladen');
                return;
            }
            
            await sendToN8N({ file });
        }

        async function sendToN8N(payload) {
            const resultDiv = document.getElementById('result');
            const spinner = document.getElementById('spinner');
            
            // Show loading
            resultDiv.style.display = 'none';
            spinner.style.display = 'block';
            
            try {
                const formData = new FormData();
                
                if (payload.file) {
                    formData.append('data', payload.file);
                } else if (payload.imageUrl) {
                    formData.append('imageUrl', payload.imageUrl);
                }
                
                const response = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    body: formData
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP Error: ${response.status}`);
                }
                
                const data = await response.json();
                
                // Hide loading
                spinner.style.display = 'none';
                
                // Show result
                displayResult(data);
                
            } catch (error) {
                spinner.style.display = 'none';
                showError(`Fehler: ${error.message}`);
            }
        }

        function displayResult(data) {
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';
            resultDiv.className = data.success ? 'success' : 'error';
            
            const actionBadge = data.action === 'create' 
                ? '<span class="badge create">NEU ERSTELLT</span>' 
                : '<span class="badge update">AKTUALISIERT</span>';
            
            const contactData = data.data || {};
            
            resultDiv.innerHTML = `
                <div class="result-title">
                    ✅ Erfolgreich verarbeitet ${actionBadge}
                </div>
                <p style="color: #666; margin-bottom: 15px;">${data.message || ''}</p>
                
                <div class="result-data">
                    ${contactData.name ? `
                    <div class="result-field">
                        <div class="result-label">👤 Name:</div>
                        <div class="result-value">${contactData.name}</div>
                    </div>` : ''}
                    
                    ${contactData.company ? `
                    <div class="result-field">
                        <div class="result-label">🏢 Firma:</div>
                        <div class="result-value">${contactData.company}</div>
                    </div>` : ''}
                    
                    ${contactData.title ? `
                    <div class="result-field">
                        <div class="result-label">💼 Position:</div>
                        <div class="result-value">${contactData.title}</div>
                    </div>` : ''}
                    
                    ${contactData.email ? `
                    <div class="result-field">
                        <div class="result-label">📧 E-Mail:</div>
                        <div class="result-value">${contactData.email}</div>
                    </div>` : ''}
                    
                    ${contactData.phone ? `
                    <div class="result-field">
                        <div class="result-label">📱 Telefon:</div>
                        <div class="result-value">${contactData.phone}</div>
                    </div>` : ''}
                    
                    ${contactData.website ? `
                    <div class="result-field">
                        <div class="result-label">🌐 Website:</div>
                        <div class="result-value"><a href="${contactData.website}" target="_blank">${contactData.website}</a></div>
                    </div>` : ''}
                    
                    ${contactData.address ? `
                    <div class="result-field">
                        <div class="result-label">📍 Adresse:</div>
                        <div class="result-value">${contactData.address}</div>
                    </div>` : ''}
                    
                    ${contactData.notes ? `
                    <div class="result-field">
                        <div class="result-label">📝 Notizen:</div>
                        <div class="result-value">${contactData.notes}</div>
                    </div>` : ''}
                </div>
                
                <p style="margin-top: 15px; color: #999; font-size: 0.85em;">
                    ⏱️ ${data.timestamp || new Date().toISOString()}
                </p>
            `;
        }

        function showError(message) {
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';
            resultDiv.className = 'error';
            resultDiv.innerHTML = `
                <div class="result-title">❌ Fehler</div>
                <p style="color: #666;">${message}</p>
            `;
        }
    </script>
</body>
</html>
